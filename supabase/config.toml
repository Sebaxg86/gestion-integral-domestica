project_id = "gestion-integral-domestica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
min_password_length = 12
password_requirements = "lower_upper_letters_digits"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.process-reminders]
verify_jwt = false

[functions.finalize-document]
verify_jwt = true

[functions.replace-document-file]
verify_jwt = true

[functions.cleanup-files]
verify_jwt = false
